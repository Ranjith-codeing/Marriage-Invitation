<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120c10" />
    <title>%TITLE%</title>
    <meta name="description" content="%DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%TITLE%" />
    <meta property="og:description" content="%DESCRIPTION%" />
    <!--OG_IMAGE-->
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23120c10'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' text-anchor='middle' fill='%23d8b56a'%3E%26%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Manrope:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@400;500&display=swap"
    />

    <!-- Critical styles for the loading screen (shown before the main CSS arrives) -->
    <style>
      html, body { margin: 0; background: #0e090c; }
      .loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 60%, #2a1a1f 0%, #0e090c 70%); color: #f3e9d8; font-family: 'Cormorant Garamond', Georgia, serif; text-align: center; transition: opacity 1.2s ease, visibility 1.2s; }
      .loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      .loader__inner { padding: 24px; max-width: 520px; }
      .loader__monogram { width: 92px; height: 92px; margin: 0 auto 1.4rem; opacity: 0; animation: loaderIn 1.4s 0.1s ease forwards; }
      .loader__monogram circle { fill: none; stroke: #d8b56a; stroke-dasharray: 360; stroke-dashoffset: 360; animation: ringDraw 2.4s 0.2s cubic-bezier(.65,0,.35,1) forwards; }
      .loader__monogram text { fill: #e9cf8f; font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; }
      @keyframes ringDraw { to { stroke-dashoffset: 0; } }
      .loader__names { font-size: clamp(2.1rem, 7vw, 3.6rem); font-weight: 300; letter-spacing: 0.02em; margin: 0; opacity: 0; animation: loaderIn 1.6s 0.2s ease forwards; }
      .loader__names em { color: #d8b56a; font-style: italic; padding: 0 0.15em; }
      .loader__text { font-family: 'Manrope', system-ui, sans-serif; font-size: 0.78rem; letter-spacing: 0.32em; text-transform: uppercase; color: #cdbfa8; margin: 1.4rem 0 1.6rem; opacity: 0; animation: loaderIn 1.6s 0.6s ease forwards; }
      .loader__bar { width: min(240px, 60vw); height: 1px; margin: 0 auto; background: rgba(216, 181, 106, 0.2); overflow: hidden; }
      .loader__bar span { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, transparent, #d8b56a, #f3e3b8); transform-origin: left; transform: scaleX(0); transition: transform 0.4s ease; }
      .loader__pct { font-family: 'Manrope', system-ui, sans-serif; font-size: 0.7rem; letter-spacing: 0.2em; color: #9d8f7a; margin-top: 0.8rem; }
      @keyframes loaderIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body class="is-loading">
    <a class="skip-link" href="#invitation">Skip to the invitation</a>

    <div class="loader" id="loader" role="status" aria-live="polite">
      <canvas class="loader__dust" aria-hidden="true"></canvas>
      <div class="loader__inner">
        <div class="loader__monogram" data-loader-monogram aria-hidden="true"></div>
        <p class="loader__names" data-loader-names>&nbsp;</p>
        <p class="loader__text" data-loader-text>Our story is loading…</p>
        <div class="loader__bar" aria-hidden="true"><span data-loader-bar></span></div>
        <p class="loader__pct" data-loader-pct>0%</p>
        <div class="loader__enter" data-loader-enter hidden>
          <button type="button" class="btn btn--gold" data-enter="music">Open the invitation <span aria-hidden="true">♫</span></button>
          <button type="button" class="btn btn--ghost" data-enter="quiet">Enter without music</button>
        </div>
      </div>
    </div>

    <canvas id="scene" class="scene-canvas" aria-hidden="true"></canvas>
    <div class="scene-poster" aria-hidden="true"></div>
    <div class="scene-dim" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <div class="cursor-glow" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="scene-switch" aria-hidden="true"></div>

    <div id="app"></div>

    <noscript>
      <p style="color:#f3e9d8;font-family:Georgia,serif;text-align:center;padding:3rem 1rem">
        This invitation needs JavaScript enabled to open.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
